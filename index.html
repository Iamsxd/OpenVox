<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const primary = (navigator.languages?.[0] || navigator.language || 'en').toLowerCase().split(/[-_]/)[0];
        const detectedLanguage = primary === 'zh' ? 'zh' : primary === 'uk' ? 'uk' : primary === 'de' ? 'de' : 'en';
        try {
          const savedLanguage = localStorage.getItem('openvox.language');
          const savedTheme = localStorage.getItem('openvox.theme');
          document.documentElement.lang = ['en', 'uk', 'de', 'zh'].includes(savedLanguage) ? savedLanguage : detectedLanguage;
          document.documentElement.dataset.theme = ['system', 'dark', 'light'].includes(savedTheme) ? savedTheme : 'system';
        } catch {
          document.documentElement.lang = detectedLanguage;
          document.documentElement.dataset.theme = 'system';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="description" content="OpenVox Studio is a privacy-first browser studio for real-time pitch detection, vocal training, instrument tuning, audio analysis, music transcription, score editing and choir rehearsal. Your voice stays on your device." />
    <meta name="keywords" content="voice analyzer, pitch detector, vocal training, singing lessons, sight singing, ear training, breath training, instrument tuner, guitar tuner, chromatic tuner, audio studio, spectrum analyzer, music transcription, score editor, choir rehearsal, MusicXML, MIDI, Web Audio API, OpenVox Studio" />
    <link rel="canonical" href="https://vadymyem.github.io/OpenVox/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenVox Studio" />
    <meta property="og:title" content="OpenVox Studio — Your voice. Understood." />
    <meta property="og:description" content="Private, local-first vocal analysis, transcription, score editing and practice tools — directly in your browser." />
    <meta property="og:url" content="https://vadymyem.github.io/OpenVox/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenVox Studio — Your voice. Understood." />
    <meta name="twitter:description" content="Privacy-first voice analysis and music transcription directly in your browser." />
    <link rel="icon" href="/openvox-icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/openvox-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/openvox-180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "OpenVox Studio",
        "url": "https://vadymyem.github.io/OpenVox/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any modern browser",
        "description": "Privacy-first browser studio for real-time pitch detection, vocal training, instrument tuning, audio analysis, music transcription, score editing and choir rehearsal.",
        "inLanguage": ["en", "uk", "de", "zh-CN"],
        "isAccessibleForFree": true
      }
    </script>
    <title>OpenVox Studio — Your voice. Understood.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        if (!location.hostname.endsWith('.github.io')) return;
        const rawEntry = '/src/' + 'main.tsx';
        const sourceEntry = document.querySelector(`script[type="module"][src="${rawEntry}"]`);
        if (!sourceEntry) return;
        sourceEntry.remove();
        const root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#030712;color:#dde8ff;font:16px/1.6 system-ui,sans-serif">
            <section style="max-width:720px;border:1px solid rgba(200,169,110,.28);border-radius:20px;padding:28px;background:rgba(8,14,28,.92)">
              <h1 style="margin:0 0 12px;color:#e8d0a0;font-size:1.6rem">OpenVox deployment is not built yet</h1>
              <p style="margin:0 0 12px">GitHub Pages is serving the Vite source repository directly instead of the production <code>dist</code> artifact.</p>
              <p style="margin:0">Open the repository settings and select <strong>Settings → Pages → Source → GitHub Actions</strong>, then run the Pages deployment workflow.</p>
            </section>
          </main>`;
      })();
    </script>
  </body>
</html>
