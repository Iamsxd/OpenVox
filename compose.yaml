services:
  postgres:
    image: postgres:17-alpine
    container_name: openvox-postgres
    environment:
      POSTGRES_DB: openvox
      POSTGRES_USER: openvox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openvox-local-change-me}
    volumes:
      - openvox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvox -d openvox"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: openvox-api-local:latest
    container_name: openvox-api
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: openvox
      PGUSER: openvox
      PGPASSWORD: ${POSTGRES_PASSWORD:-openvox-local-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  openvox:
    build:
      context: .
      args:
        OPENVOX_PUBLIC_URL: ${OPENVOX_PUBLIC_URL:-http://localhost:8080}
    image: openvox-local:latest
    container_name: openvox-local
    ports:
      - "${OPENVOX_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openvox-postgres-data:
